<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE EXPANSE</title>
    <link rel="stylesheet" href="../css/sby.css">
    <link rel="shortcut icon" href="https://imposiblealx.github.io/stardust_musicbox/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>THE EXPANSE</h1>
            <p class="subheading">FACTION MUSIC PLAYER</p>
            <a href="/stardust_musicbox/manual" class="manual-btn-topright">Manual Mode</a>
        </header>
        <div class="faction-buttons">
            <img src="../assets/images/logos/nofactions.png" alt="No Factions" onclick="playNoFactions()" title="NO FACTIONS?">
        </div>

        <div class="player-container" id="playerContainer">
            <div class="audio-hidden">
                <audio id="audioPlayer"></audio>
            </div>
            <div class="player-sections">
                <div class="track-name-section">
                    <span id="trackName">Track Name</span>
                </div>
                <div class="faction-section">
                    <span id="factionName"></span>
                </div>
                <div class="timer-section">
                    <span id="timeDisplay">00:00</span>
                </div>
                <div class="volume-section">
                    <div id="volumeSliderContainer">
                        <div id="volumeBarBg">
                            <div id="volumeBar"></div>
                        </div>
                        <span id="volumeValue">90%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/expanse.js"></script>
    <script src="../js/volumecontrol.js"></script>
</body>
</html>
