<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMB Manual</title>
  <link rel="stylesheet" href="../css/causa.css">
  <link rel="shortcut icon" href="https://imposiblealx.github.io/stardust_musicbox/favicon.ico" type="image/x-icon">
</head>
<body>
  <div class="main-container">
    <header>
      <h1>STARDUST MUSIC BOX</h1>
      <p class="subheading">MANUAL MODE</p>
      <a href="https://imposiblealx.github.io/stardust_musicbox/sby/" class="manual-btn-topright">Random Mode</a>
    </header>

    <div class="manual-columns">
      <!-- Column 1 -->
      <div class="manual-list">
        <h2>All Tracks</h2>
        <ul id="allTracksList" class="manual-track-list"></ul>
      </div>

      <!-- Column 2 -->
      <div class="manual-list playlist-container">
        <div class="playlist-header">
          <h2>My Playlist</h2>
          <div class="controls">
            <button id="btnPlayPause" title="Play/Pause">
              <img id="imgPlayPause"
                  src="../assets/images/buttons/play_button.png"
                  alt="Play/Pause">
            </button>
            <button id="btnLoop" title="Loop Off">
              <img id="imgLoop"
                  src="../assets/images/buttons/loop_button.png"
                  alt="Loop">
            </button>
          </div>
        </div>
        <ul id="secondList" class="manual-track-list"></ul>

        <div class="player-container" id="playerContainer">
          <div class="audio-hidden">
            <audio id="audioPlayer"></audio>
          </div>
          <div class="player-sections">
            <div class="track-name-section"><span id="trackName">Drag &amp; drop your favourite tracks</span></div>
            <div class="faction-section"><span id="factionName">No faction selected</span></div>
            <div class="timer-section"><span id="timeDisplay">00:00</span></div>
            <div class="volume-section">
              <div id="volumeSliderContainer">
                <div id="volumeBarBg"><div id="volumeBar"></div></div>
                <span id="volumeValue">90%</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.js"></script>
    <script src="../js/secondary.js"></script>
    <script src="../js/volumecontrol.js"></script>
</body>
</html>
